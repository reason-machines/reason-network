name: reason-network
version: "0.1.0"
description: "Give each Hermes conversation an address on Reason Network, exchange messages and text files, and optionally wake its input queue."
author: "zaydiscold"
provides_tools:
  - reason_network_list_agents
  - reason_network_send_message
  - reason_network_check_inbox
  - reason_network_ask_user
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - post_compaction
